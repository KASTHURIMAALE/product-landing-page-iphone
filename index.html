<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Sale</title>

    <style>
        @import url("https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap");

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #000000;
            color: #ffffff;
        }

        .main-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 20px;
        }

        .logo {
            height: 30px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .content-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .heading {
            text-align: center;
            margin-bottom: 20px;
        }

        .iphone-image {
            width: 250px;
            align-self: center;
        }

        .address-container {
            margin-top: auto;
            align-self: flex-end;
        }

        .website-address {
            color: #9aa5b1;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="main-container">
        <nav class="navbar">
            <img src="https://assets.ccbp.in/frontend/intermediate-rwd/iPhone-sale-logo.png" alt="logo" class="logo" />
            <div class="nav-links">
                <p>Home</p>
                <p>Features</p>
            </div>
        </nav>

        <div class="content-container">
            <h1 class="heading">iPhone 12</h1>

            <img src="https://assets.ccbp.in/frontend/intermediate-rwd/iphone-12-img.png" alt="iphone" class="iphone-image" />

            <div class="address-container">
                <p class="website-address">www.apple.com</p>
            </div>
        </div>
    </div>
</body>
</html>
